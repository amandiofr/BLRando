<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>BLRando</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Map image drawn by the phone (360x360: map, tracks, arrow) -->
    <!-- North-up map from the phone, turned by the watch compass so it stays aligned with the ground -->
    <img id="map" alt="" />

    <!-- North marker on the rim, turns with the compass -->
    <div id="northRing">
        <!-- Black triangle pointing outward, "N" underneath, both turning with the ring -->
        <svg id="northMark" viewBox="0 0 30 40">
            <path d="M15,2 L25,17 L5,17 Z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" />
            <text id="northLetter" x="15" y="36" text-anchor="middle" font-size="19.4" font-weight="bold" font-family="sans-serif"
                  fill="#000" stroke="#fff" stroke-width="3.1" paint-order="stroke">N</text>
        </svg>
    </div>

    <!-- Sun and moon on the rim, like north: each ring turned so its top points to the body.
         The icon inside is turned back so it stays upright. Dimmed below the horizon. -->
    <div id="sunRing" class="skyRing">
        <svg id="sunMark" class="skyMark" viewBox="-15 -15 30 30">
            <g stroke="#000" stroke-width="4.5" stroke-linecap="round">
                <path d="M0,-12.5V-9.5M0,12.5V9.5M-12.5,0H-9.5M12.5,0H9.5M-8.8,-8.8L-6.7,-6.7M8.8,8.8L6.7,6.7M-8.8,8.8L-6.7,6.7M8.8,-8.8L6.7,-6.7" />
            </g>
            <g stroke="#FFC107" stroke-width="2.4" stroke-linecap="round">
                <path d="M0,-12.5V-9.5M0,12.5V9.5M-12.5,0H-9.5M12.5,0H9.5M-8.8,-8.8L-6.7,-6.7M8.8,8.8L6.7,6.7M-8.8,8.8L-6.7,6.7M8.8,-8.8L6.7,-6.7" />
            </g>
            <circle r="6.5" fill="#FFC107" stroke="#000" stroke-width="1.2" />
        </svg>
    </div>
    <!-- Sunset time, curved along the rim next to the sun, on the side of the center
         (path set by main.js so the text is never upside down) -->
    <svg id="sunsetText" class="skyText" viewBox="0 0 360 360">
        <path id="sunsetPath" d="" fill="none" />
        <text font-size="22" font-weight="bold" font-family="sans-serif" fill="#FFC107"
              stroke="#000" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">
            <textPath href="#sunsetPath" xlink:href="#sunsetPath" startOffset="50%" text-anchor="middle" id="sunsetLabel"></textPath>
        </text>
    </svg>
    <div id="moonRing" class="skyRing">
        <svg id="moonMark" class="skyMark" viewBox="-15 -15 30 30">
            <!-- Night-sky badge so it stands out on a light map, dark disc, then the lit part
                 (path set by main.js from the phase) -->
            <circle r="14" fill="#0D1B3A" stroke="#fff" stroke-width="1.5" />
            <circle r="10" fill="#4A5068" />
            <path id="moonLit" d="" fill="#FFF6C8" />
        </svg>
    </div>

    <!-- Track ends, placed by main.js: car at the start, checkered flag at the end (pin tip = the point) -->
    <svg id="flagMark" class="endMark" viewBox="0 0 32 42">
        <path d="M10,26 L16,40 L22,26 Z" fill="#fff" stroke="#333" stroke-width="1.5" stroke-linejoin="round" />
        <circle cx="16" cy="16" r="14" fill="#fff" stroke="#333" stroke-width="1.5" />
        <path d="M10,7h3.5v3.33h-3.5zM17,7h3.5v3.33h-3.5zM13.5,10.33h3.5v3.33h-3.5zM20.5,10.33h3.5v3.33h-3.5zM10,13.67h3.5v3.33h-3.5zM17,13.67h3.5v3.33h-3.5z" fill="#222" />
        <rect x="10" y="7" width="14" height="10" fill="none" stroke="#333" stroke-width="1.5" />
        <path d="M10,7V26" stroke="#333" stroke-width="2" stroke-linecap="round" />
    </svg>
    <svg id="carMark" class="endMark" viewBox="0 0 32 42">
        <path d="M10,26 L16,40 L22,26 Z" fill="#fff" stroke="#333" stroke-width="1.5" stroke-linejoin="round" />
        <circle cx="16" cy="16" r="14" fill="#fff" stroke="#333" stroke-width="1.5" />
        <path d="M9,16 L11.5,10.5 L20.5,10.5 L24,16 Z" fill="#1E5AA8" />
        <rect x="5" y="15" width="22" height="6" rx="2" fill="#1E5AA8" />
        <path d="M11.8,15 L13.2,12 L15.6,12 L15.6,15 Z M17,15 L17,12 L19.8,12 L21.6,15 Z" fill="#fff" />
        <circle cx="10" cy="21.5" r="2.6" fill="#222" stroke="#fff" stroke-width="1" />
        <circle cx="22" cy="21.5" r="2.6" fill="#222" stroke="#fff" stroke-width="1" />
    </svg>

    <!-- Hiker: always at the center, Gaia-style arrowhead, turned by the phone's "heading" -->
    <svg id="hiker" viewBox="-20 -24 40 44">
        <path d="M0,-22 L-17,16 L0,6 Z" fill="#C4561A" fill-opacity="0.85" />
        <path d="M0,-22 L0,6 L17,16 Z" fill="#F0843A" fill-opacity="0.85" />
        <path d="M0,-22 L17,16 L0,6 L-17,16 Z" fill="none" stroke="#8A3A0E" stroke-width="1.2" stroke-linejoin="round" />
    </svg>

    <!-- Position when the direction is unknown -->
    <div id="hikerDot"></div>

    <!-- Top: recording dot + time -->
    <div id="top" class="band"><span id="rec"></span><span id="time">--:--</span></div>

    <!-- Bottom: duration · distance (only while recording) -->
    <div id="bottom" class="band"></div>

    <!-- Lifebuoy alert: red ring + distance -->
    <div id="offRing"></div>
    <div id="offText"></div>

    <!-- Zoom level, shown briefly when the bezel turns -->
    <div id="zoomTip"></div>

    <!-- Alerts: link lost, GPS lost, battery... -->
    <div id="status"></div>

    <!-- Back key menu: bezel to choose, back key or tap to confirm -->
    <div id="menu"></div>

    <script src="i18n.js"></script>
    <script src="link.js"></script>
    <script src="main.js"></script>
</body>
</html>
